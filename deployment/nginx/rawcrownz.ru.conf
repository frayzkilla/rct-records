# Install in the VPS Nginx, not inside the frontend container.
# Check the certificate paths with `sudo certbot certificates` first.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rawcrownz.ru;

    ssl_certificate /etc/letsencrypt/live/rawcrownz.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rawcrownz.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 201m;
    client_body_timeout 30s;
    add_header Strict-Transport-Security "max-age=604800" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

# HTTP serves only certificate validation, never the site or API.
# Certbot's nginx authenticator can also install its temporary challenge here.
server {
    listen 80;
    listen [::]:80;
    server_name rawcrownz.ru;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 444;
    }
}
