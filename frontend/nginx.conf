limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=likes:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=analytics:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=metrics:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=connections:10m;

map $http_x_forwarded_proto $original_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_tokens off;
    # Only the VPS reverse proxy can reach the loopback-published port.
    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Real-IP;
    client_max_body_size 201m;
    client_body_timeout 30s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn connections 10;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $http_host;
    # Replace client-supplied forwarding headers at the trusted entry point.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $original_scheme;
    
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /stats {
        add_header X-Robots-Tag "noindex, nofollow" always;
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location = /api/analytics/events {
        limit_req zone=analytics burst=30 nodelay;
        client_max_body_size 2k;
        proxy_pass http://backend:3000;
    }

    location = /api/stats/server {
        limit_req zone=metrics burst=3 nodelay;
        proxy_pass http://backend:3000;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        client_max_body_size 64k;
        proxy_pass http://backend:3000;
    }

    location ~ ^/api/(beats|albums|artists)(/[0-9]+)?$ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://backend:3000;
    }

    location ~ ^/api/beats/[0-9]+/like$ {
        limit_req zone=likes burst=10 nodelay;
        client_max_body_size 4k;
        proxy_pass http://backend:3000;
    }

    location /storage/ {
        alias /storage/;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            audio/mpeg mp3;
            audio/wav wav;
        }
    }
}
