services:
  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    volumes:
      - ./storage:/storage:ro
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./backend
    ports:
      - "3002:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-yarik}
      DB_DATABASE: ${DB_DATABASE:-rawcrownz}
      GOD_ADMIN_PASSWORD: ${GOD_ADMIN_PASSWORD:?Set GOD_ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3001}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
    volumes:
      - ./storage:/app/storage:rw
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-yarik}
      POSTGRES_DB: ${DB_DATABASE:-rawcrownz}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
