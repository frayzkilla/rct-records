services:
  frontend:
    build: ./frontend
    environment:
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ./storage:/storage:ro
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./backend
    environment:
      METRICS_COLLECTOR_URL: http://metrics:9101
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DATABASE: ${DB_DATABASE:-rawcrownz}
      GOD_ADMIN_PASSWORD: ${GOD_ADMIN_PASSWORD:?Set GOD_ADMIN_PASSWORD in .env}
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://rawcrownz.ru}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
    volumes:
      - ./storage:/app/storage:rw
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  metrics:
    build: ./backend
    command: ["python", "-m", "app.metrics_collector"]
    restart: unless-stopped
    read_only: true
    environment:
      HOST_PROC: /host/proc
      HOST_ROOT: /host/root
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/sys:ro
      - /:/host/root:ro
    networks:
      - app-network

  backups:
    build: ./backups
    restart: unless-stopped
    read_only: true
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DATABASE: ${DB_DATABASE:-rawcrownz}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-446597696}
      BACKUP_TIME: ${BACKUP_TIME:-10:00}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Etc/UTC}
      BACKUP_WORKDIR: /backups
      STORAGE_PATH: /storage
    volumes:
      - ./storage:/storage:ro
      - backup-data:/backups
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_DATABASE:-rawcrownz}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

volumes:
  postgres-data:
  backup-data:

networks:
  app-network:
    driver: bridge
